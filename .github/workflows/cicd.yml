name: CICD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 
      - name: Build docker image
        run: docker build -t harmanxze/nexa-backend:latest .
      - name: Publish image to docker hub
        run: docker push harmanxze/nexa-backend:latest
        
  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Pull image from docker hub
        run: docker pull harmanxze/nexa-backend:latest
      - name: Delete old container
        run: docker rm -f nexa-server-container
      - name: Run docker container
        run: docker run -d -p 3001:3001 --name nexa-server-container harmanxze/nexa-backend:latest